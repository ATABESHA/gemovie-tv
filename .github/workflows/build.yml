name: Build APK

# Two channels:
#  - every push to main  -> TEST build  (release "test", for BlueStacks / PC)
#  - a tag named tv-*    -> TV release  (release "latest", the TV offers it as an update)
#    or run this workflow by hand with "Publish to TV" ticked.
on:
  push:
    branches: [main]
    tags: ['tv-*']
  workflow_dispatch:
    inputs:
      publish_to_tv:
        description: 'Publish to TV (the TV app will offer this update)'
        type: boolean
        default: false

permissions:
  contents: write

# A newer build on the same channel replaces an older one still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TO_TV: ${{ startsWith(github.ref, 'refs/tags/tv-') || inputs.publish_to_tv == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner already has the Android SDK ($ANDROID_HOME);
      # the Android Gradle plugin downloads any missing platform itself.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle --no-daemon -PversionCode=${{ github.run_number }} assembleRelease

      - name: Rename APK and write version
        run: |
          cp app/build/outputs/apk/release/app-release.apk gemovie-tv.apk
          echo "${{ github.run_number }}" > version.txt

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: gemovie-tv-${{ github.run_number }}
          path: gemovie-tv.apk

      # Test channel: .../releases/download/test/gemovie-tv-test.apk
      - name: Publish TEST build
        if: env.TO_TV != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp gemovie-tv.apk gemovie-tv-test.apk
          gh release delete test --yes --cleanup-tag || true
          gh release create test gemovie-tv-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "TEST build ${{ github.run_number }} (not on the TV)" \
            --notes "Built from ${GITHUB_SHA::7}. For testing in BlueStacks. The TV ignores this."

      # TV channel: .../releases/download/latest/gemovie-tv.apk (+ version.txt for the updater)
      - name: Publish to TV
        if: env.TO_TV == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest gemovie-tv.apk version.txt --target "$GITHUB_SHA" \
            --title "MyMovie (build ${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. The app on the TV offers this update by itself."
