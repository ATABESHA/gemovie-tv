name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels an older build still running.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner already has the Android SDK ($ANDROID_HOME);
      # the Android Gradle plugin downloads any missing platform itself.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk gemovie-tv.apk

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: gemovie-tv
          path: gemovie-tv.apk

      # Fixed download link: .../releases/download/latest/gemovie-tv.apk
      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest gemovie-tv.apk --title "GE Movie TV (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Install on the TV by sideloading."
