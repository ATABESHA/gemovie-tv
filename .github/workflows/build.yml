name: Build apps

# Builds three apps from the same code:
#   gemovie-tv.apk      Android TV (remote control)
#   gemovie-mobile.apk  Android phones and tablets (touch)
#   gemovie-ios.ipa     iPhone and iPad (unsigned: install it with Sideloadly / AltStore)
#
# Two channels:
#  - every push to main  -> TEST builds (release "test", files end in -test)
#  - a tag named tv-*    -> release "latest" (the apps offer it as an update)
#    or run this workflow by hand with "Publish to TV" ticked.
on:
  push:
    branches: [main]
    tags: ['tv-*']
    paths-ignore: ['tools/**']
  workflow_dispatch:
    inputs:
      publish_to_tv:
        description: 'Publish to TV (the apps will offer this update)'
        type: boolean
        default: false

permissions:
  contents: write

# A newer build on the same channel replaces an older one still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TO_TV: ${{ startsWith(github.ref, 'refs/tags/tv-') || inputs.publish_to_tv == true }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner already has the Android SDK ($ANDROID_HOME);
      # the Android Gradle plugin downloads any missing platform itself.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build TV and phone/tablet apps
        run: gradle --no-daemon -PversionCode=${{ github.run_number }} assembleTvRelease assembleMobileRelease

      - name: Rename APKs and write version
        run: |
          SUFFIX=$([ "$TO_TV" = "true" ] && echo "" || echo "-test")
          cp app/build/outputs/apk/tv/release/app-tv-release.apk "gemovie-tv$SUFFIX.apk"
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk "gemovie-mobile$SUFFIX.apk"
          echo "${{ github.run_number }}" > version.txt

      - name: Upload APKs (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: gemovie-*.apk

      # Test channel: .../releases/download/test/gemovie-tv-test.apk (and gemovie-mobile-test.apk)
      - name: Publish TEST builds
        if: env.TO_TV != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete test --yes --cleanup-tag || true
          gh release create test gemovie-tv-test.apk gemovie-mobile-test.apk version.txt --prerelease --target "$GITHUB_SHA" \
            --title "TEST build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. For testing (BlueStacks, phone). The iPhone file is added when its build finishes."

      # Release channel: .../releases/download/latest/gemovie-tv.apk (+ gemovie-mobile.apk, version.txt)
      - name: Publish release
        if: env.TO_TV == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest gemovie-tv.apk gemovie-mobile.apk version.txt --target "$GITHUB_SHA" \
            --title "MyMovie (build ${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. The Android apps offer this update by themselves. iPhone: gemovie-ios.ipa (added when its build finishes)."

  # iPhone / iPad. Runs after the Android release, so a failure here never holds up the TV.
  ios:
    needs: android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project GeMovie.xcodeproj -target GeMovie -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build | tail -40
          test -d build/Release-iphoneos/GeMovie.app

      - name: Package IPA
        working-directory: ios
        run: |
          SUFFIX=$([ "$TO_TV" = "true" ] && echo "" || echo "-test")
          mkdir -p Payload
          cp -R build/Release-iphoneos/GeMovie.app Payload/
          zip -qry "../gemovie-ios$SUFFIX.ipa" Payload

      - name: Upload IPA (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.run_number }}
          path: gemovie-ios*.ipa

      - name: Add IPA to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$([ "$TO_TV" = "true" ] && echo "latest" || echo "test")
          gh release upload "$TAG" gemovie-ios*.ipa --clobber
