plugins {
    id 'com.android.application'
}

// The GitHub build passes its run number, so every build has a higher version.
def buildNumber = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())

android {
    namespace 'com.atabesha.gemovietv'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    buildFeatures {
        buildConfig true
    }

    // Two apps from the same code:
    //   tv     - Android TV, driven by the remote (the original app, same id so updates install over it)
    //   mobile - Android phones and tablets, driven by touch (its own id, can sit next to the TV app)
    flavorDimensions 'device'
    productFlavors {
        tv {
            dimension 'device'
            applicationId 'com.atabesha.gemovietv'
            buildConfigField 'String', 'UI_MODE', '"tv"'
            buildConfigField 'String', 'APK_NAME', '"gemovie-tv"'
            manifestPlaceholders = [orientation: 'landscape', softInput: 'adjustUnspecified',
                                    appTheme   : '@android:style/Theme.Black.NoTitleBar.Fullscreen']
        }
        mobile {
            dimension 'device'
            applicationId 'com.atabesha.gemovie.mobile'
            buildConfigField 'String', 'UI_MODE', '"touch"'
            buildConfigField 'String', 'APK_NAME', '"gemovie-mobile"'
            manifestPlaceholders = [orientation: 'unspecified', softInput: 'adjustResize',
                                    appTheme   : '@android:style/Theme.Black.NoTitleBar']
        }
    }

    // A fixed key, so a new APK installs over the old one (keeping sign-ins).
    // Personal sideloaded app: the key is kept in the repo on purpose.
    signingConfigs {
        tv {
            storeFile file('gemovie-tv.jks')
            storePassword 'gemovietv'
            keyAlias 'gemovie'
            keyPassword 'gemovietv'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tv
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.tv
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
