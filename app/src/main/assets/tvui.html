<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>MyMovie</title>
<style>
:root{--red:#e50914;--bg:#0b0c10;--panel:#16171d;--dim:rgba(255,255,255,.62)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;overflow:hidden;
  font-family:"Noto Sans Georgian","FiraGO",sans-serif;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#app.off{display:none}

/* ---------- top bar */
#top{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:10px;
  padding:0 48px;z-index:5;background:linear-gradient(#0b0c10 55%,rgba(11,12,16,0))}
#top .logo{display:flex;align-items:center;padding:4px;border-radius:12px;margin-right:14px}
#top .logo img{height:46px;width:auto;border-radius:8px;display:block}
#top .logo span{font-size:18px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
#top .logo span i{font-style:normal;color:#c8afff}
#top .tab{font-size:17px;padding:9px 13px;white-space:nowrap;border-radius:24px;color:var(--dim)}
#top .tab.on{color:#fff;background:rgba(255,255,255,.12)}
#q{margin-left:auto;width:200px;min-width:120px;height:46px;border-radius:24px;border:0;padding:0 22px;
  font:17px "Noto Sans Georgian",sans-serif;background:rgba(255,255,255,.12);color:#fff;outline:none}
#q::placeholder{color:var(--dim)}
#go{height:46px;padding:0 18px;white-space:nowrap;border-radius:24px;background:rgba(255,255,255,.12);font-size:17px;
  display:flex;align-items:center}
#top .round{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:rgba(255,255,255,.12);font-size:24px;
  display:flex;align-items:center;justify-content:center}
#lang svg{width:30px;height:20px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#lang.fx{background:#fff!important}
#top .fx{background:#fff!important;color:#000!important}
#top .logo.fx{background:rgba(255,255,255,.9)!important}
#q.fx{background:rgba(255,255,255,.22)!important;color:#fff!important;box-shadow:0 0 0 3px #fff}

/* ---------- preview (focused title + description) */
#pv{position:absolute;left:0;right:0;top:0;height:330px;overflow:hidden}
#pv .bg{position:absolute;right:0;top:0;width:66%;height:100%;background-size:cover;background-position:center 25%;
  opacity:0;transition:opacity .35s}
#pv .bg.on{opacity:1}
#pv .fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 34%,rgba(11,12,16,.75) 55%,rgba(11,12,16,0) 80%),
  linear-gradient(0deg,var(--bg) 0,rgba(11,12,16,0) 40%)}
#pv .txt{position:absolute;left:48px;top:84px;width:640px}
#pv h1{margin:0;font-size:34px;line-height:1.15;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pv .en{font-size:17px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:15px;color:#ddd}
.meta span{background:rgba(255,255,255,.12);padding:3px 10px;border-radius:6px}
.meta .imdb{background:#f5c518;color:#000;font-weight:700}
#pv .plot{margin-top:12px;font-size:16px;line-height:1.5;color:#ddd;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden;min-height:24px}

/* ---------- scrolling content under the preview */
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.scroller{position:absolute;left:0;right:0;top:330px;bottom:0;overflow:hidden}
.screen.full .scroller{top:76px}
.line{padding:0 48px}
.row h3{margin:4px 0 0;font-size:18px;font-weight:600}
.track{display:flex;gap:14px;padding:12px 0 14px;transition:transform .25s ease;will-change:transform}
.card{flex:0 0 105px;width:105px}
.card .img{width:105px;height:158px;border-radius:8px;background:#22232a center/cover no-repeat;position:relative;
  transition:transform .15s ease}
.card .img img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.card .prog{position:absolute;left:6px;right:6px;bottom:6px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.card .prog i{display:block;height:100%;background:var(--red)}
.card .badge{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.75);font-size:10px;padding:1px 5px;border-radius:4px}
.card .t{margin-top:6px;font-size:12px;line-height:1.3;height:31px;overflow:hidden;color:#ccc}
.card.fx .img{transform:scale(1.08);box-shadow:0 0 0 3px var(--red),0 12px 30px rgba(0,0,0,.7)}
.card.fx .t{color:#fff}
.grid{display:flex;gap:14px;padding:10px 48px 6px}
.bar{display:flex;gap:12px;align-items:center;padding-top:4px;padding-bottom:10px}
.btn{font-size:17px;padding:10px 20px;border-radius:24px;background:rgba(255,255,255,.12);white-space:nowrap}
.btn small{color:var(--dim);margin-left:6px}
.btn.fx{background:#fff;color:#000}
.btn.fx small{color:#555}
.note{font-size:15px;color:var(--dim);margin-left:auto}
.msg{padding:40px 48px;font-size:20px;color:var(--dim)}
.msg .btn{display:inline-block;margin:16px 10px 0 0;color:#fff}

/* ---------- details */
#det{position:fixed;inset:0;display:none;background:var(--bg)}
#det.on{display:block}
#det .bg{position:absolute;right:0;top:0;width:75%;height:100%;background-size:cover;background-position:center 20%}
#det .fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 30%,rgba(11,12,16,.8) 52%,rgba(11,12,16,.1) 85%),
  linear-gradient(0deg,var(--bg) 0,rgba(11,12,16,0) 35%)}
#det .txt{position:absolute;left:64px;top:70px;width:660px}
#det h1{margin:0;font-size:42px;line-height:1.15}
#det .en{font-size:19px;color:var(--dim);margin-top:6px}
#det .facts{margin-top:16px;font-size:16px;line-height:1.7;color:#ccc}
#det .facts b{color:#fff;font-weight:600}
#det .plot{margin-top:14px;font-size:17px;line-height:1.55;color:#e4e4e4;display:-webkit-box;-webkit-line-clamp:6;
  -webkit-box-orient:vertical;overflow:hidden}
#det .bar{padding:26px 0 0}
#det .btn{font-size:20px;padding:13px 30px}
#det .btn.play{background:var(--red)}
#det .btn.play.fx{background:#fff}

/* ---------- list overlay (filters) */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}
#ov.on{display:block}
#ov .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;max-height:600px;
  background:#1c1d24;border-radius:16px;padding:14px 0;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#ov h4{margin:4px 26px 10px;font-size:16px;color:var(--dim);font-weight:500}
#ov .items{max-height:540px;overflow:hidden}
#ov .it{font-size:19px;padding:11px 26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ov .it.sel{background:#fff;color:#000}
#ov.drop{background:rgba(0,0,0,.35)}
#ov.drop .box{left:auto;right:40px;top:80px;transform:none;width:380px}
#ov .it.info{color:var(--dim);font-size:16px}
#ov .it.info.sel{background:rgba(255,255,255,.18);color:#fff}
#ov .it svg{width:26px;height:17px;vertical-align:-2px;margin-right:12px;border-radius:2px}
#ov .it.head{color:var(--dim);font-size:15px;padding:14px 26px 6px;display:flex;align-items:center;gap:4px}
#ov .it.head svg.ic{width:26px;height:26px;border-radius:0;color:#fff;margin-right:10px}
#ov .it .ok{color:#4ade80;margin-left:8px}
#ov .it.sel .ok{color:#16a34a}

/* ---------- player: only this is shown while a movie plays */
#player{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#000;z-index:30}
#trailer{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#000;z-index:35}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;color:var(--dim);z-index:25;display:none}
#loading.on{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="pv"><div class="bg"></div><div class="fade"></div>
    <div class="txt"><h1></h1><div class="en"></div><div class="meta"></div><div class="plot"></div></div></div>

  <section id="home" class="screen"><div class="scroller"><div class="body"></div></div></section>
  <section id="browse" class="screen"><div class="scroller"><div class="body"></div></div></section>

  <div id="top">
    <div class="logo f" data-act="home"><img src="__LOGO__" alt="MyMovie"></div>
    <div class="tab f" data-act="home" id="t-home" data-t="home"></div>
    <div class="tab f" data-act="movie" id="t-movie" data-t="movies"></div>
    <div class="tab f" data-act="serial" id="t-serial" data-t="series"></div>
    <div class="tab f" data-act="cw" id="t-cw" data-t="cw"></div>
    <div class="tab f" data-act="list" id="t-list" data-t="mylist"></div>
    <input id="q" class="f" type="text" autocomplete="off">
    <div id="go" class="f" data-act="search" data-t="searchBtn"></div>
    <div id="lang" class="f round" data-act="langmenu"></div>
    <div id="set" class="f round" data-act="settings">⚙</div>
  </div>
</div>

<div id="det"><div class="bg"></div><div class="fade"></div><div class="txt"></div></div>
<div id="ov"><div class="box"><h4></h4><div class="items"></div></div></div>
<div id="loading"></div>

<script>
(function () {
  'use strict';
  var App = window.TVApp;
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function txt(root, sel) { var e = root.querySelector(sel); return e ? e.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function tmdb(u, size) { return u ? u.replace('/t/p/original/', '/t/p/' + size + '/') : ''; }

  // ============================================== languages and settings
  // Kept on this TV until changed: app language and the default audio language for movies.
  function setting(k, def) { try { return localStorage.getItem('tv_' + k) || def; } catch (e) { return def; } }
  function saveSetting(k, v) { try { localStorage.setItem('tv_' + k, v); } catch (e) {} }
  var LANG = setting('lang', 'ka');        // ka | ru | en
  var MLANG = setting('mlang', 'ka');      // default movie audio
  var I18N = {
    ka: { home: 'მთავარი', movies: 'ფილმები', series: 'სერიალები', cw: 'განაგრძე', cwRow: 'განაგრძე ყურება',
      mylist: 'ჩემი სია', searchPh: 'ძებნა...', searchBtn: 'ძებნა', searchFor: 'ძებნა:', loading: 'იტვირთება…',
      notFound: 'ვერაფერი მოიძებნა', loadFail: 'ვერ ჩაიტვირთა', retry: 'თავიდან ცდა', site: 'ვებსაიტის გახსნა',
      page: 'გვერდი', clear: 'გასუფთავება', all: 'ყველა', watch: '▶ ყურება', resume: '▶ გაგრძელება',
      fromStart: '↺ თავიდან', forget: 'სიიდან წაშლა', trailer: '🎬 თრეილერი', back: 'უკან',
      addList: '+ ჩემს სიაში', inList: '✓ ჩემს სიაშია', noVideo: 'ვიდეო ვერ მოიძებნა.',
      cwEmpty: 'ჯერ არაფერი გიყურებიათ. დაიწყე ფილმი და აქ გამოჩნდება.',
      listEmpty: 'სია ცარიელია. ფილმის გვერდზე დააჭირე „+ ჩემს სიაში“.', titles: 'სათაური',
      settings: 'პარამეტრები', checkUpd: '⟳ განახლების შემოწმება', version: 'ვერსია', language: 'ენა',
      appLang: 'აპის ენა', movieLang: 'ფილმის ენა', newRow: '',
      genre: 'ჟანრი', director: 'რეჟისორი', country: 'ქვეყანა', studio: 'სტუდია', dubbing: 'გახმოვანება', sort: 'სორტირება' },
    ru: { home: 'Главная', movies: 'Фильмы', series: 'Сериалы', cw: 'Продолжить', cwRow: 'Продолжить просмотр',
      mylist: 'Мой список', searchPh: 'Поиск...', searchBtn: 'Найти', searchFor: 'Поиск:', loading: 'Загрузка…',
      notFound: 'Ничего не найдено', loadFail: 'Не удалось загрузить', retry: 'Повторить', site: 'Открыть сайт',
      page: 'Стр.', clear: 'Сбросить', all: 'Все', watch: '▶ Смотреть', resume: '▶ Продолжить',
      fromStart: '↺ Сначала', forget: 'Убрать', trailer: '🎬 Трейлер', back: 'Назад',
      addList: '+ В мой список', inList: '✓ В моём списке', noVideo: 'Видео не найдено.',
      cwEmpty: 'Вы ещё ничего не смотрели. Начните фильм, и он появится здесь.',
      listEmpty: 'Список пуст. На странице фильма нажмите «+ В мой список».', titles: 'назв.',
      settings: 'Настройки', checkUpd: '⟳ Проверить обновления', version: 'Версия', language: 'Язык',
      appLang: 'Язык приложения', movieLang: 'Язык фильмов', newRow: 'Новинки',
      genre: 'Жанр', director: 'Режиссёр', country: 'Страна', studio: 'Студия', dubbing: 'Озвучка', sort: 'Сортировка' },
    en: { home: 'Home', movies: 'Movies', series: 'Series', cw: 'Continue', cwRow: 'Continue watching',
      mylist: 'My List', searchPh: 'Search...', searchBtn: 'Search', searchFor: 'Search:', loading: 'Loading…',
      notFound: 'Nothing found', loadFail: "Couldn't load", retry: 'Try again', site: 'Open website',
      page: 'Page', clear: 'Clear', all: 'All', watch: '▶ Watch', resume: '▶ Resume',
      fromStart: '↺ From start', forget: 'Remove', trailer: '🎬 Trailer', back: 'Back',
      addList: '+ My List', inList: '✓ In My List', noVideo: 'Video not found.',
      cwEmpty: "You haven't watched anything yet. Start a movie and it will show here.",
      listEmpty: 'Your list is empty. On a movie page press "+ My List".', titles: 'titles',
      settings: 'Settings', checkUpd: '⟳ Check for updates', version: 'Version', language: 'Language',
      appLang: 'App language', movieLang: 'Movie language', newRow: 'New releases',
      genre: 'Genre', director: 'Director', country: 'Country', studio: 'Studio', dubbing: 'Dubbing', sort: 'Sort' }
  };
  var LANG_NAMES = { ka: 'ქართული', ru: 'Русский', en: 'English' };
  function T(k) {
    var d = I18N[LANG] || I18N.ka;
    if (Object.prototype.hasOwnProperty.call(d, k)) return d[k];     // '' is a real value (use the site's text)
    return Object.prototype.hasOwnProperty.call(I18N.ka, k) ? I18N.ka[k] : k;
  }
  var FLAGS = {
    ka: '<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><rect x="13" width="4" height="20" fill="#e8112d"/>' +
      '<rect y="8" width="30" height="4" fill="#e8112d"/><g fill="#e8112d"><rect x="5.6" y="2.3" width="1.8" height="4.4"/>' +
      '<rect x="4.3" y="3.6" width="4.4" height="1.8"/><rect x="22.6" y="2.3" width="1.8" height="4.4"/><rect x="21.3" y="3.6" width="4.4" height="1.8"/>' +
      '<rect x="5.6" y="13.3" width="1.8" height="4.4"/><rect x="4.3" y="14.6" width="4.4" height="1.8"/><rect x="22.6" y="13.3" width="1.8" height="4.4"/>' +
      '<rect x="21.3" y="14.6" width="4.4" height="1.8"/></g></svg>',
    ru: '<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><rect y="6.67" width="30" height="6.67" fill="#0039a6"/>' +
      '<rect y="13.33" width="30" height="6.67" fill="#d52b1e"/></svg>',
    en: '<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#012169"/><path d="M0,0L60,40M60,0L0,40" stroke="#fff" stroke-width="8"/>' +
      '<path d="M0,0L60,40M60,0L0,40" stroke="#c8102e" stroke-width="3"/><path d="M30,0V40M0,20H60" stroke="#fff" stroke-width="12"/>' +
      '<path d="M30,0V40M0,20H60" stroke="#c8102e" stroke-width="7"/></svg>'
  };
  // Fact labels as the site writes them (Georgian) -> translation keys
  var FACT_KEYS = { 'ჟანრი': 'genre', 'რეჟისორი': 'director', 'ქვეყანა': 'country', 'სტუდია': 'studio' };

  // ================================================================ data
  // Everything comes from ge.movie's own pages (same site, so the app may read them).
  var docCache = new Map();
  function getDoc(url) {
    if (docCache.has(url)) return docCache.get(url);
    var p = fetch(url, { credentials: 'include' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (h) { return new DOMParser().parseFromString(h, 'text/html'); });
    docCache.set(url, p);
    p.catch(function () { docCache.delete(url); });
    if (docCache.size > 40) docCache.delete(docCache.keys().next().value);
    return p;
  }

  function parseCard(c) {
    var a = c.querySelector('a[href*="/movie/"],a[href*="/serial/"]');
    if (!a) return null;
    var url = a.getAttribute('href');
    var img = c.querySelector('img[data-src]') || c.querySelector('img');
    var poster = img ? (img.getAttribute('data-src') || img.getAttribute('src') || '') : '';
    if (/thumb\.svg|poster\.svg/.test(poster)) poster = '';
    var tA = c.querySelector('h2 a[title]') || c.querySelector('a[title]') || a;
    var both = (tA.getAttribute('title') || '').split(' / ');
    var p = c.querySelector('h2 p'), sp = c.querySelector('h2 span');
    var eps = c.querySelector('.gm-card-episodes:not([hidden]) .gm-episode-text');
    return {
      url: url, serial: /\/serial\//.test(url),
      title: p ? p.textContent.trim() : both[0], en: sp ? sp.textContent.trim() : (both[1] || ''),
      poster: tmdb(poster, 'w342'), bg: tmdb(img && img.getAttribute('bg') || '', 'w1280'),
      rating: txt(c, '.imdb span'), year: txt(c, '.gm-year-value'),
      eps: eps && !/S00\s*\/\s*E00/.test(eps.textContent) ? eps.textContent.trim() : '',   // movies carry a dummy S00 / E00
      langs: $$('.gm-language-text', c).map(function (e) { return e.textContent.trim().toUpperCase(); })
    };
  }
  function parseCards(root) {
    var seen = {}, out = [];
    // Home rows: .movie-card; lists: .filter-result-card; search: .popular-card / .serials-card
    $$('.movie-card, .filter-result-card, .popular-card, .serials-card', root).forEach(function (c) {
      var it = parseCard(c);
      if (it && !seen[it.url]) { seen[it.url] = 1; out.push(it); }
    });
    return out;
  }

  // "New" row: the home-page block that holds the #კინოთეატრებში link.
  function loadNew() {
    return getDoc('/').then(function (doc) {
      var a = $$('a[href*="#"]', doc).filter(function (x) {
        var h = x.getAttribute('href') || '';
        try { h = decodeURIComponent(h); } catch (e) {}
        return h.indexOf('#კინოთეატრებში') >= 0;
      })[0];
      var sec = a && (a.closest('section') || a.parentElement.parentElement);
      sec = sec || doc.getElementById('block_cinemas');
      var siteTitle = sec ? (txt(sec, '.section-title') || 'კინოთეატრებში') : 'კინოთეატრებში';
      return { title: siteTitle,
        items: sec ? parseCards(sec) : [] };
    });
  }

  function qs(params) {
    var s = '';
    Object.keys(params || {}).forEach(function (k) {
      if (params[k] !== '' && params[k] != null) s += '&' + k + '=' + encodeURIComponent(params[k]);
    });
    return s;
  }
  function listUrl(type, params, page) {
    return '/filter-movies?type=' + type + qs(params) + (page > 1 ? '&page=' + page : '');
  }
  function loadList(type, params, page) {
    return getDoc(listUrl(type, params, page)).then(function (doc) {
      var nums = $$('.pagination a', doc).map(function (a) { return parseInt(a.textContent, 10) || 0; });
      return { doc: doc, items: parseCards(doc.querySelector('.mlist') || doc), pages: Math.max.apply(null, [page].concat(nums)) };
    });
  }

  function parseFilters(doc) {
    var defs = [['genre', 'genres[]', 'genre'], ['translation', 'languages', 'dubbing'],
      ['country', 'countries', 'country'], ['sort', 'sort', 'sort']];   // label = translation key
    return defs.map(function (d) {
      var fi = doc.querySelector('.filter-dropdowns .filter-item.' + d[0]);
      if (!fi) return null;
      var opts = $$('input[name="' + d[1] + '"]', fi).map(function (i) {

  var detCache = new Map();

  // ======================================================= rendering

  function metaHtml(it, d) {

  // ---------- titles and descriptions in the app language
  // ge.movie writes them in Georgian; for Russian/English the app asks TMDB (the movie
  // database the player itself uses) and machine-translates what TMDB lacks.
  var LOC = new Map(), locWait = {};
  function cardTitle(it) { return LANG === 'ka' ? it.title : (it.en || it.title); }
  function factOrder(d) { return ['ჟანრი', 'რეჟისორი', 'ქვეყანა', 'სტუდია'].filter(function (k) { return d && d.facts[k]; }); }
  function localize(it, d, cb) {
    if (LANG === 'ka' || !d) { cb(null); return; }
    var key = it.url + '|' + LANG;
    if (LOC.has(key)) { cb(LOC.get(key)); return; }
    (locWait[key] = locWait[key] || []).push(cb);
    if (locWait[key].length > 1) return;                 // already asked
    if (!App || !App.localize) { UI.onLocal(key, null); return; }
    var facts = factOrder(d).map(function (k) { return d.facts[k]; }).join('\n');
    App.localize(key, d.tmdb ? d.tmdb.kind : '', d.tmdb ? d.tmdb.id : '', LANG, d.plot || '', facts);
  }
  function localDone(key, data) {
    var loc = data ? { title: data.title || '', plot: data.plot || '', facts: data.facts || [] } : null;
    LOC.set(key, loc);
    if (LOC.size > 300) LOC.delete(LOC.keys().next().value);
    (locWait[key] || []).forEach(function (cb) { cb(loc); });
    delete locWait[key];
  }
  function shownTitle(it, loc) { return LANG === 'ka' ? it.title : (loc && loc.title) || it.en || it.title; }
  function shownSub(it, loc) {

  }

  // Preview area: shows the focused title, then its description a moment later.

  // ================================================= continue watching
  // Kept on this TV only (the app's own storage), newest first.
  var CW_KEY = 'tv_continue';
  function cwAll() { try { return JSON.parse(localStorage.getItem(CW_KEY) || '[]'); } catch (e) { return []; } }
  function cwSave(list) { try { localStorage.setItem(CW_KEY, JSON.stringify(list.slice(0, 40))); } catch (e) {} }
  function cwGet(url) { return cwAll().filter(function (x) { return x.url === url; })[0] || null; }
  function cwForget(url) { cwSave(cwAll().filter(function (x) { return x.url !== url; })); }
  function cwUpdate(it, p) {
    if (!it || !p || !(p.d > 0)) return;
    var list = cwAll().filter(function (x) { return x.url !== it.url; });
    var done = p.t / p.d > 0.95;
    if (done && !it.serial) { cwSave(list); return; }          // finished movie: drop it
    list.unshift({ url: it.url, t: done ? 0 : Math.floor(p.t), d: Math.floor(p.d), ep: it.serial ? (p.ep || '') : '', at: Date.now(),
      item: { url: it.url, serial: it.serial, title: it.title, en: it.en, poster: it.poster, bg: it.bg,
        rating: it.rating, year: it.year, langs: it.langs, eps: '' } });
    cwSave(list);
  }
  function epLabel(ep) {
    var m = /^(\d+)-(\d+)$/.exec(ep || '');

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') + m : m) + ':' + (x < 10 ? '0' : '') + x;
  }

  // Home row "განაგრძე ყურება" (first row when there is something to continue).

  // ---------- home: rows of New, Movies, Series
  var H = { rows: [] };
  function buildHome() {
    var body = $('#home .body');
    body.innerHTML = '<div class="msg">' + esc(T('loading')) + '</div>';
    H.rows = [];
    var defs = [
      { key: 'new', load: function () { return loadNew(); } },
      { key: 'movie', title: T('movies'), type: 'movie' },
      { key: 'serial', title: T('series'), type: 'serial' }
    ];
    return Promise.all(defs.map(function (d) {
      if (d.load) return d.load().then(function (r) { return { key: d.key, title: T('newRow') || r.title, items: r.items }; });
      return loadList(d.type, {}, 1).then(function (r) {

    factOrder(d).forEach(function (k, i) {
      var v = loc && loc.facts[i] ? loc.facts[i] : d.facts[k];
      facts += '<div><b>' + esc(T(FACT_KEYS[k])) + ':</b> ' + esc(v) + '</div>';
    });
    var plot = !d ? T('loading') : LANG === 'ka' ? d.plot : loc === undefined ? T('loading') : (loc && loc.plot) || d.plot;
    $('.txt', det).innerHTML = '<h1>' + esc(shownTitle(it, loc)) + '</h1><div class="en">' + esc(shownSub(it, loc)) + '</div>' +
      '<div class="meta">' + metaHtml(it, d) + '</div><div class="facts">' + facts + '</div>' +
      '<div class="plot">' + esc(plot) + '</div>' +
      detButtons(it);
    focus($('[data-act=resume]', det) || $('[data-act=play]', det));
  }
  function detButtons(it) {
    var cw = cwGet(it.url);
    var tr = trailers.get(it.url) ? '<span class="btn f" data-act="trailer">' + esc(T('trailer')) + '</span>' : '';
    var ml = '<span class="btn f" data-act="mylist">' + esc(T(inMyList(it.url) ? 'inList' : 'addList')) + '</span>';
    if (cw && (cw.t > 30 || cw.ep)) {
      var where = [epLabel(cw.ep), cw.t > 30 ? fmtTime(cw.t) : ''].filter(Boolean).join(' · ');
      return '<div class="bar"><span class="btn play f" data-act="resume">' + esc(T('resume')) + ' <small>' + esc(where) + '</small></span>' +
        '<span class="btn f" data-act="play">' + esc(T('fromStart')) + '</span>' + tr + ml +
        '<span class="btn f" data-act="forget">' + esc(T('forget')) + '</span>' +
        '<span class="btn f" data-act="back">' + esc(T('back')) + '</span></div>';
    }
    return '<div class="bar"><span class="btn play f" data-act="play">' + esc(T('watch')) + '</span>' + tr + ml +
      '<span class="btn f" data-act="back">' + esc(T('back')) + '</span></div>';
  }

  // ---------- trailers (YouTube)
  var trailers = new Map();          // movie page -> YouTube video id
  var asked = {};
  function findTrailer(it) {
    if (trailers.has(it.url) || asked[it.url] || !App || !App.findTrailer) return;
    asked[it.url] = 1;
    var q = (it.en || it.title) + ' ' + (it.year || '') + (it.serial ? ' series' : '') + ' trailer';
    App.findTrailer(q, it.url);      // the app answers through UI.onTrailer
  }
  function trailerFound(url, id) {
    if (!id || trailers.has(url)) return;
    trailers.set(url, id);
    if (detItem && detItem.url === url && det.classList.contains('on')) {
      var act = cur && cur.dataset ? cur.dataset.act : '';
      $('.txt .bar', det).outerHTML = detButtons(detItem);
      focus($('[data-act="' + act + '"]', det) || $('[data-act=resume]', det) || $('[data-act=play]', det));
    }
  }
  var trailer = null;
  function openTrailer() {
    var id = detItem && trailers.get(detItem.url);
    if (!id) return;
    var f = document.createElement('iframe');
    f.id = 'trailer';
    f.allow = 'autoplay; encrypted-media; fullscreen';
    f.setAttribute('allowfullscreen', '');
    f.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3';
    trailer = f;
    document.body.appendChild(f);
  }
  function closeTrailer() {
    var f = trailer;
    trailer = null;
    try { f.src = 'about:blank'; } catch (e) {}
    f.remove();                       // nothing of it keeps running
    focus($('[data-act=trailer]', det) || $('[data-act=play]', det));
  }
  function trailerKey(cmd) {
    var m = { ok: ['playpause'], playpause: ['playpause'], play: ['play'], pause: ['pause'],
      left: ['seek', -10], rw: ['seek', -10], right: ['seek', 10], ff: ['seek', 10] }[cmd];
    if (m) try { trailer.contentWindow.postMessage({ __tv: { media: m[0], arg: m[1] } }, '*'); } catch (e) {}
  }
  function closeDetails() {
    renderCwRow();
    if (screen === 'browse' && (B.type === 'cw' || B.type === 'list')) { closeDetailsTo(); loadPage(true); return; }
    closeDetailsTo();
  }
  function closeDetailsTo() {
    det.classList.remove('on');
    app.classList.remove('off');
    detItem = null;
    var s = stack.pop();
    focus(s && s.focus && s.focus.isConnected ? s.focus : firstCard());
  }

  // ---------- player: only the player runs; the interface is switched off
  var playing = null, playingItem = null, playerWin = null, startMsg = null;
  function post(m) { try { playing.contentWindow.postMessage({ __tv: m }, '*'); } catch (e) {} }
  // resume: { t: seconds, ep: '1-3' } from Continue Watching, or nothing to start from the beginning
  function openPlayer(resume) {
    if (!detData || !detData.embed) { $('.plot', det).textContent = T('noVideo'); return; }
    clearTimeout(pvTimer);
    var f = document.createElement('iframe');
    f.id = 'player';
    f.allow = 'autoplay; encrypted-media; fullscreen';
    f.setAttribute('allowfullscreen', '');
    var src = detData.embed, m = resume && /^(\d+)-(\d+)$/.exec(resume.ep || '');
    if (m && /[?&]season=\d+/.test(src)) {
      src = src.replace(/([?&]season=)\d+/, '$1' + m[1]).replace(/([?&]episode=)\d+/, '$1' + m[2]);
    }
    f.src = src;
    startMsg = { pstart: 1, resume: resume ? { t: resume.t || 0, ep: resume.ep || '' } : null, lang: LANG, audio: MLANG };
    f.addEventListener('load', function () { post(startMsg); });
    playing = f;
    playingItem = detItem;
    det.classList.remove('on');
    app.classList.add('off');
    document.body.appendChild(f);
    playerWin = f.contentWindow;
  }
  function closePlayer() {
    post({ pstop: 1 });                     // the player reports its last position first
    var f = playing;
    playing = null;
    f.style.visibility = 'hidden';
    setTimeout(function () {
      try { f.src = 'about:blank'; } catch (e) {}
      f.remove();
      playerWin = null;
      if (detItem) $('.txt .bar', det).outerHTML = detButtons(detItem);
      if (det.classList.contains('on')) focus($('[data-act=resume]', det) || $('[data-act=play]', det));
    }, 500);
    try { App && App.setFsControls && App.setFsControls(false); } catch (e) {}
    det.classList.add('on');
    focus($('[data-act=play]', det));
  }
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.__tv) return;
    if (playing && d.__tv.hello && ev.source === playing.contentWindow) post(startMsg);
    if (d.__tv.progress && playerWin && ev.source === playerWin) cwUpdate(playingItem, d.__tv.progress);
  });

  // ---------- overlay list (filters)
  var OV = null;
  // list items: { t: text, cur: true for the current choice, run: fn, info: true for a plain line, icon: html }
  function openOverlay(title, list, asDrop) {
    var sel = -1;
    list.forEach(function (x, i) { if (x.cur && sel < 0) sel = i; });
    if (sel < 0) sel = list.findIndex(function (x) { return !x.head; });
    OV = { list: list, sel: sel, ret: OV ? OV.ret : cur };
    $('h4', ov).textContent = title;
    $('h4', ov).style.display = title ? '' : 'none';
    ov.classList.toggle('drop', !!asDrop);
    ov.classList.add('on');
    renderOverlay();
  }
  function renderOverlay() {
    var box = $('.items', ov);
    box.innerHTML = OV.list.map(function (x, i) {
      return '<div class="it' + (x.info ? ' info' : '') + (x.head ? ' head' : '') + (i === OV.sel ? ' sel' : '') + '">' +
        (x.icon || '') + esc(x.t) + (x.cur ? ' <b class="ok">✓</b>' : '') + '</div>';
    }).join('');
    var s = $('.sel', box);
    if (s) box.scrollTop = s.offsetTop - box.clientHeight / 2 + s.offsetHeight / 2;
  }
  function closeOverlay() {
    ov.classList.remove('on');
    var r = OV && OV.ret;
    OV = null;
    if (r && r.isConnected) focus(r);
  }

  // ======================================================= navigation
  // Each screen is a list of lines (top bar, filter bar, rows, grid lines);
  // Up/Down move between lines, Left/Right along a line.
  function lines() {
    if (det.classList.contains('on')) return [{ key: 'det', els: $$('.f', det) }];
    var out = [{ key: 'top', els: $$('.f', top) }];
    var scr = $('#' + screen);
    $$('.line', scr).forEach(function (l, i) {
      var els = $$('.f', l);
      if (!els.length) return;
      out.push({ key: screen + i, el: l, row: l.classList.contains('row') ? l.__row : null,
        grid: l.classList.contains('grid'), els: els });
    });
    return out;
  }
  function locate(L, el) {
    for (var i = 0; i < L.length; i++) {
      var j = L[i].els.indexOf(el);
      if (j >= 0) return { li: i, ix: j };
    }
    return null;
  }
  function nearestX(els, from) {
    if (!from) return 0;
    var r = from.getBoundingClientRect(), cx = (r.left + r.right) / 2, best = 0, bd = Infinity;
    els.forEach(function (e, i) {
      var q = e.getBoundingClientRect(), d = Math.abs((q.left + q.right) / 2 - cx);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }
  function firstCard() { return $('#' + screen + ' .card') || $('#t-home'); }

  function focus(el) {
    if (cur) cur.classList.remove('fx');
    cur = el;
    if (!el) return;
    el.classList.add('fx');
    if (el.id === 'q' || el.closest('#top') || el.closest('#det')) return;
    // Row: slide the track so the focused card stays near the left edge.
    var track = el.parentElement && el.parentElement.classList.contains('track') ? el.parentElement : null;
    if (track) {
      var idx = Array.prototype.indexOf.call(track.children, el);
      var step = el.offsetWidth + 14;
      var maxX = Math.max(0, track.scrollWidth - track.parentElement.clientWidth + 96);
      track.style.transform = 'translateX(' + (-Math.round(Math.min(maxX, Math.max(0, idx * step - step * 0.4)))) + 'px)';
      mem[track.parentElement.__row ? track.parentElement.__row.key : ''] = idx;
    }
    // Page: bring the focused line to the top of the scrolling area.
    var line = el.closest('.line'), sc = el.closest('.scroller');
    if (line && sc) {
      var target = line.offsetTop - (line.classList.contains('grid') ? 6 : 0);
      if (line.classList.contains('filters')) target = 0;
      sc.scrollTo({ top: target, behavior: 'smooth' });
    }
    var it = items.get(el);
    if (it) showPreview(it);
  }

  function move(dir) {
    var L = lines(), pos = locate(L, cur);
    if (!pos) { focus(firstCard()); return; }
    var line = L[pos.li];
    if (dir === 'left' || dir === 'right') {
      var n = pos.ix + (dir === 'right' ? 1 : -1);
      if (line.grid && n >= line.els.length && L[pos.li + 1] && L[pos.li + 1].grid) { focus(L[pos.li + 1].els[0]); return; }
      if (line.grid && n < 0 && L[pos.li - 1] && L[pos.li - 1].grid) { var pl = L[pos.li - 1].els; focus(pl[pl.length - 1]); return; }
      if (n < 0 || n >= line.els.length) return;
      focus(line.els[n]);
      if (line.row && n >= line.els.length - 5) rowMore(line.row);
      return;
    }
    var t = pos.li + (dir === 'down' ? 1 : -1);
    if (t < 0) return;
    if (t >= L.length) { if (screen === 'browse') loadPage(false); return; }
    var tl = L[t], idx;
    if (tl.row && mem[tl.row.key] != null) idx = Math.min(mem[tl.row.key], tl.els.length - 1);
    else idx = nearestX(tl.els, cur);
    if (cur && cur.id === 'q') cur.blur();
    focus(tl.els[idx]);
    if (screen === 'browse' && tl.grid && t >= L.length - 2) loadPage(false);
  }

  function activate(el) {
    if (!el) return;
    var it = items.get(el);
    if (it) { openDetails(it); return; }
    if (el.id === 'q') {
      // Opens the TV keyboard; Enter on it runs the search.
      qWanted = true;
      var r = el.getBoundingClientRect();
      if (App && App.tap) App.tap((r.left + r.width / 2) / innerWidth, (r.top + r.height / 2) / innerHeight);
      else el.focus();
      return;
    }
    if (el.dataset.filter != null) { pickFilter(+el.dataset.filter); return; }
    var act = el.dataset.act;
    if (act === 'home') { show('home'); focus(firstCard()); }
    else if (act === 'movie' || act === 'serial' || act === 'cw' || act === 'list') openBrowse(act);
    else if (act === 'search') doSearch();
    else if (act === 'settings') settingsMenu();
    else if (act === 'langmenu') langMenu();
    else if (act === 'mylist') {
      toggleMyList(detItem);
      $('[data-act=mylist]', det).textContent = T(inMyList(detItem.url) ? 'inList' : 'addList');
    }
    else if (act === 'clear') { B.params = {}; setFilter('', ''); }
    else if (act === 'play') openPlayer(null);
    else if (act === 'resume') openPlayer(cwGet(detItem.url));
    else if (act === 'trailer') openTrailer();
    else if (act === 'forget') { cwForget(detItem.url); $('.txt .bar', det).outerHTML = detButtons(detItem); focus($('[data-act=play]', det)); }
    else if (act === 'back') closeDetails();
    else if (act === 'retry' && el.__run) el.__run();
    else if (act === 'site') location.href = 'https://ge.movie/';
  }

  function doSearch() {
    var q = $('#q').value.trim();
    $('#q').blur();
    if (!q) { focus($('#q')); return; }
    openBrowse('search', q);
  }
  $('#q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
  });
  // Android may put the page's focus into the first text box on its own (for example
  // after the start-up animation). Then the remote's arrows and OK would type into the
  // search field instead of moving the menu. Only OK on the field may give it the focus.
  var qWanted = false;
  $('#q').addEventListener('focus', function () { if (!qWanted) $('#q').blur(); });
  $('#q').addEventListener('blur', function () { qWanted = false; });

  // ============================================== remote keys (from the app)
  var lastKey = 0;
  var UI = {
    key: function (cmd, fullscreen, repeat) {
      if (playing) { post({ pkey: cmd, repeat: repeat }); return; }
      if (trailer) { if (cmd === 'back') closeTrailer(); else if (!repeat || /left|right|ff|rw/.test(cmd)) trailerKey(cmd); return; }
      if (OV) {
        if (cmd === 'up' || cmd === 'down') {
          var step = cmd === 'up' ? -1 : 1, n = OV.sel + step;
          while (n >= 0 && n < OV.list.length && OV.list[n].head) n += step;     // skip headings
          if (n >= 0 && n < OV.list.length) { OV.sel = n; renderOverlay(); }
        }
        else if (cmd === 'ok' && !repeat) { var x = OV.list[OV.sel]; closeOverlay(); x.run(); }
        else if (cmd === 'back') closeOverlay();
        return;
      }
      if (cmd === 'ok') { if (!repeat) activate(cur); return; }
      if (cmd === 'back') { UI.back(); return; }
      if (cmd === 'pageup' || cmd === 'pagedown') cmd = cmd === 'pageup' ? 'up' : 'down';
      if (['up', 'down', 'left', 'right'].indexOf(cmd) < 0) return;
      var now = Date.now();
      if (repeat && now - lastKey < 110) return;   // holding an arrow: smooth, not frantic
      lastKey = now;
      move(cmd);
    },
    // Back: player -> details -> list/home -> top bar -> (app asks to exit)
    back: function () {
      if (playing) { closePlayer(); return true; }
      if (trailer) { closeTrailer(); return true; }
      if (OV) { closeOverlay(); return true; }
      if (det.classList.contains('on')) { closeDetails(); return true; }
      if (document.activeElement && document.activeElement.id === 'q') { $('#q').blur(); return true; }
      if (screen === 'browse') { show('home'); focus(firstCard()); return true; }
      if (cur && !cur.closest('#top')) { focus($('#t-home')); return true; }
      return false;
    }
  };
  UI.onTrailer = trailerFound;
  UI.onLocal = localDone;
  window.__tvui = UI;
  if (!window.__tv) window.__tv = { key: UI.key, back: UI.back, pageReady: function () {} };

  // ============================================================== start
  applyLang(false);
  try { App && App.setLang && App.setLang(LANG); } catch (e) {}
  show('home');
  focus($('#t-home'));
  buildHome().then(function () {
    if (cur && cur.id === 't-home' && !OV && !det.classList.contains('on')) focus(firstCard());
  });
})();
</script>
</body>
</html>
